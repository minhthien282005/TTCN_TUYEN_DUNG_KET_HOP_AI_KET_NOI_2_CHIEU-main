<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f8f5"><meta name="description" content="Tìm tin tuyển dụng theo vị trí, địa điểm và loại công việc trên Ketnoi."><title>Tìm cơ hội nghề nghiệp — Ketnoi</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/sprint2/sprint2.css"><link rel="stylesheet" href="/sprint2/search.css"><script src="/sprint2/jobs.js" defer></script></head>
<body><header class="s2-header"><a class="brand" href="/"><span class="brand-mark"><img src="/logo-mark.svg" alt=""></span><span class="brand-wordmark">KETNOI</span></a><nav><a href="/my-jobs.html">Tin đã lưu / đã xem</a><a href="/employer.html">Dành cho doanh nghiệp</a><a href="/">Trang chủ</a></nav></header><main class="s2-shell"><div class="s2-heading"><p class="s2-eyebrow">CƠ HỘI ĐÃ ĐƯỢC KIỂM DUYỆT</p><h1>Tìm công việc<br><em>tiếp theo của bạn.</em></h1><p>Khám phá tin tuyển dụng theo vị trí, địa điểm và hình thức làm việc.</p></div><form id="search-form" class="s2-search"><label>Từ khóa<input name="q" placeholder="Chức danh, công ty, kỹ năng"></label><label>Địa điểm<input name="location" placeholder="Hà Nội, từ xa…"></label><label>Loại công việc<select name="type"><option value="">Tất cả loại hình</option><option>Thực tập</option><option>Toàn thời gian</option><option>Bán thời gian</option><option>Freelance</option><option>Hợp đồng</option></select></label><label>Lĩnh vực<input name="industry" placeholder="Công nghệ, marketing…"></label><label>Sắp xếp<select name="sort"><option value="newest">Mới nhất</option><option value="relevance">Phù hợp nhất</option><option value="salary">Lương cao</option><option value="deadline">Sắp hết hạn</option></select></label><details class="s2-advanced"><summary>Bộ lọc nâng cao</summary><div class="s2-advanced-grid"><label>Kỹ năng<input name="skill" placeholder="React"></label><label>Lương từ (VNĐ/tháng)<input name="salaryMin" type="number" min="0"></label><label>Lương đến (VNĐ/tháng)<input name="salaryMax" type="number" min="0"></label><label>Cấp bậc<input name="level" placeholder="Intern, Junior"></label><label>Kinh nghiệm<input name="experience" placeholder="Không yêu cầu"></label><label>Hình thức<select name="workMode"><option value="">Tất cả</option><option>Tại văn phòng</option><option>Kết hợp</option><option>Từ xa</option></select></label><label>Quy mô công ty<input name="companySize" placeholder="11–50 nhân sự"></label><label>Đăng trong<input name="postedWithin" type="number" min="1" max="365" placeholder="Số ngày"></label><label>Ngoại ngữ<input name="language" placeholder="Tiếng Anh"></label></div></details><button class="s2-button">Tìm việc <span aria-hidden="true">↗</span></button></form><div id="results-notice" role="status" aria-live="polite"></div><div class="s2-results-head"><h2 id="result-count">Việc làm</h2><button class="s2-button s2-secondary" id="clear-search">Xóa bộ lọc</button></div><div id="job-results" class="s2-public-jobs" aria-live="polite"><p class="s2-muted">Đang tải cơ hội…</p></div><div class="s2-pagination" id="pagination"></div></main><footer class="s2-footer">Ketnoi · Kết nối nghề nghiệp hai chiều</footer></body></html>
